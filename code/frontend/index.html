<!DOCTYPE html>
<!--
     白话导读：网站真正的"第一屏"，也是 Vite 的打包入口。
     <div id="app"> 是空壳，src/main.ts 会把手写的所有界面渲染进这个 div；
     <script type="module" src="/src/main.ts"> 就是告诉浏览器"从 main.ts 开始执行"。
     除此之外这个文件平时不用改（要改标题、favicon 才来这）。
   -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlayerStock · 虚拟选手股交易模拟</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
