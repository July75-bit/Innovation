# Render 部署蓝图（Blueprint）
#
# 用法：Render 控制台 → New → Blueprint → 选择本仓库，会自动识别本文件。
# 也可以不启用 Blueprint，手工在控制台创建两个服务（配置与本文件一致即可）。
#
# ⚠️ 两个必须注意的点（三份项目材料都专门警告过）：
# 1. Render 默认文件系统是临时的，重启/重新部署会丢失 SQLite 数据。
#    方案 A：付费挂载 Persistent Disk（见下方注释块），DB 路径指向挂载点；
#    方案 B：改用托管 PostgreSQL（把 DATABASE_URL 换成 postgres://...）。
# 2. 前端的 VITE_API_BASE_URL 必须是后端公网地址，不能写 127.0.0.1:8000。

services:
  # ---------------- 后端 Web Service ----------------
  - type: web
    name: playerstock-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: code/backend
    buildCommand: pip install -r requirements.txt
    # 注意：入口是 app.main:app（code/backend/app/main.py），不是手册里的 main:app
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DATABASE_URL
        # ✅ 已定方案：方案 B —— 接 Render 免费 Postgres。
        # 填法：Render 控制台 → 你的 Postgres 服务 → Connections → Internal Database URL
        # 形如 postgresql://user:password@dpg-xxxxx-a/playerstock_db
        # ⚠️ 含密码，所以用 sync: false 在控制台填写，绝不提交明文。
        # ⚠️ 若忘记填：代码会回落到本地 SQLite（临时文件系统），数据会随部署丢失。
        sync: false
      # 大模型：DeepSeek 官方 API（OpenAI 兼容协议）。
      # LLM_PROVIDER 目前只作标识，不参与请求；真正决定端点的是 LLM_BASE_URL + LLM_MODEL。
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: deepseek-flash
      - key: LLM_BASE_URL
        value: https://api.deepseek.com/v1
      - key: LLM_API_KEY
        sync: false # 在 Render 控制台手工填写，绝不提交明文
      - key: RESEED_TOKEN
        # 运维口令：POST /api/debug/reseed 与 POST /api/prices/recalc 都要带 ?token=。
        # 没配置时这两个接口直接 403（app/core/ops_auth.py），所以必须在这里生成。
        # generateValue 让 Render 生成随机串，需要重灌时去控制台 Environment 里复制。
        generateValue: true
      - key: CORS_ORIGINS
        # 直接写死前端公网地址：这是`render.yaml` 管的部署配置，写在文件里比"记得去控制台填"
        # 可靠（2026-10-25 就是因为没填，线上前端被跨域拦掉）。
        # 前端服务改名后记得同步改这里；只想临时放开全部来源时填 "*"。
        value: https://playerstock-frontend-mdlk.onrender.com

    # ⚠️ Persistent Disk 仅付费套餐可用；启用后把 DATABASE_URL 改成 sqlite:////var/data/playerstock.db
    # disk:
    #   name: playerstock-data
    #   mountPath: /var/data
    #   sizeGB: 1

  # ---------------- 每日价格自动结算（2026-11-28 方案 A） ----------------
  # 修复"价格历史停在 bootstrap 批次、不随时间更新"：每天跑一次 scripts/settle_round.py，
  # 把"已到期但没落库"的轮次用固定 seed 重放生成 (score, S)，再 POST /api/prices/recalc 补结算。
  # 幂等三重保险：脚本从"库内最新 ts"续跑 + recalc 按 (player_id, 比赛日) 去重 + 同 seed 可复现，
  # 所以 cron 重跑、停机多日后补跑都安全。第 29 轮起对阵循环（core_engine.schedule 取模），永不过季。
  # 口令：fromService 引用后端生成的 RESEED_TOKEN，明文不进仓库（控制台看不到脚本里的值）。
  - type: cron
    name: playerstock-price-settle
    runtime: python
    plan: free
    region: singapore
    # 每天 UTC 00:20（北京 08:20）跑一次：轮次日期按 UTC 零点计，0 点刚过即"结算当天轮次"。
    # 选在巡检（*/10 0-15 UTC）时间窗内，此时后端通常是热的；万一在睡，脚本自己等冷启动（<=150s）。
    schedule: "20 0 * * *"
    buildCommand: echo "settle 脚本只用标准库 + core_engine，无需构建"
    startCommand: python scripts/settle_round.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: BACKEND_BASE_URL
        value: https://playerstock-backend-mdlk.onrender.com
      - key: RESEED_TOKEN
        fromService:
          type: web
          name: playerstock-backend
          envVarKey: RESEED_TOKEN
  # ---------------- 智能体定时巡检（第 8 轮） ----------------
  # 定时让智能体"自己上班"（频率见下方 schedule）：拉行情 → 标出需要关注的标的 → 刷新今日简报（写审计表）。
  # 只调用只读接口 + 简报刷新，不下单、不碰余额。
  # 注意：这里**不设 rootDir**（构建上下文=仓库根），因为脚本在 scripts/ 下；
  # 脚本只用标准库 urllib，所以 buildCommand 不需要装依赖。
  - type: cron
    name: playerstock-agent-patrol
    runtime: python
    plan: free
    region: singapore
    # 每 10 分钟一次：Render 免费 Web Service 闲置 15 分钟就休眠，唤醒一次约 30 秒。
    # 巡检本身也是一次 HTTP 请求 → 用来"保活"；只在 UTC 0–15 点（北京 08:00–23:59）跑，
    # 避开整夜空转，免费 750 小时/月不会被打满（约 16h/天 ≈ 496h/月）。
    schedule: "*/10 0-15 * * *"
    buildCommand: echo "patrol 脚本只用标准库，无需构建"
    startCommand: python scripts/agent_patrol.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: BACKEND_BASE_URL
        value: https://playerstock-backend-mdlk.onrender.com

  # ---------------- 前端 Static Site ----------------
  - type: web
    name: playerstock-frontend
    runtime: static
    rootDir: code/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # 填后端公网地址，如 https://playerstock-backend.onrender.com
    routes:
      # SPA 路由回退，避免刷新 /market 之类的前端路由 404
      - type: rewrite
        source: /*
        destination: /index.html
