# Render 部署蓝图（Blueprint）
#
# 用法：Render 控制台 → New → Blueprint → 选择本仓库，会自动识别本文件。
# 也可以不启用 Blueprint，手工在控制台创建两个服务（配置与本文件一致即可）。
#
# ⚠️ 两个必须注意的点（三份项目材料都专门警告过）：
# 1. Render 默认文件系统是临时的，重启/重新部署会丢失 SQLite 数据。
#    方案 A：付费挂载 Persistent Disk（见下方注释块），DB 路径指向挂载点；
#    方案 B：改用托管 PostgreSQL（把 DATABASE_URL 换成 postgres://...）。
# 2. 前端的 VITE_API_BASE_URL 必须是后端公网地址，不能写 127.0.0.1:8000。

services:
  # ---------------- 后端 Web Service ----------------
  - type: web
    name: playerstock-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: code/backend
    buildCommand: pip install -r requirements.txt
    # 注意：入口是 app.main:app（code/backend/app/main.py），不是手册里的 main:app
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DATABASE_URL
        # ✅ 已定方案：方案 B —— 接 Render 免费 Postgres。
        # 填法：Render 控制台 → 你的 Postgres 服务 → Connections → Internal Database URL
        # 形如 postgresql://user:password@dpg-xxxxx-a/playerstock_db
        # ⚠️ 含密码，所以用 sync: false 在控制台填写，绝不提交明文。
        # ⚠️ 若忘记填：代码会回落到本地 SQLite（临时文件系统），数据会随部署丢失。
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_API_KEY
        sync: false # 在 Render 控制台手工填写，绝不提交明文
      - key: CORS_ORIGINS
        # 直接写死前端公网地址：这是`render.yaml` 管的部署配置，写在文件里比"记得去控制台填"
        # 可靠（2026-10-25 就是因为没填，线上前端被跨域拦掉）。
        # 前端服务改名后记得同步改这里；只想临时放开全部来源时填 "*"。
        value: https://playerstock-frontend-mdlk.onrender.com

    # ⚠️ Persistent Disk 仅付费套餐可用；启用后把 DATABASE_URL 改成 sqlite:////var/data/playerstock.db
    # disk:
    #   name: playerstock-data
    #   mountPath: /var/data
    #   sizeGB: 1

  # ---------------- 智能体定时巡检（第 8 轮） ----------------
  # 每小时让智能体"自己上班"：拉行情 → 标出需要关注的标的 → 刷新今日简报（写审计表）。
  # 只调用只读接口 + 简报刷新，不下单、不碰余额。
  # 注意：这里**不设 rootDir**（构建上下文=仓库根），因为脚本在 scripts/ 下；
  # 脚本只用标准库 urllib，所以 buildCommand 不需要装依赖。
  - type: cron
    name: playerstock-agent-patrol
    runtime: python
    plan: free
    region: singapore
    schedule: "0 * * * *" # 每小时整点（UTC）
    buildCommand: echo "patrol 脚本只用标准库，无需构建"
    startCommand: python scripts/agent_patrol.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: BACKEND_BASE_URL
        value: https://playerstock-backend-mdlk.onrender.com

  # ---------------- 前端 Static Site ----------------
  - type: web
    name: playerstock-frontend
    runtime: static
    rootDir: code/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # 填后端公网地址，如 https://playerstock-backend.onrender.com
    routes:
      # SPA 路由回退，避免刷新 /market 之类的前端路由 404
      - type: rewrite
        source: /*
        destination: /index.html
