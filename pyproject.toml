[project]
name = "playerstock"
version = "0.1.0"
description = "数据驱动的虚拟选手股交易与智能体市场模拟系统（课程作品）"
requires-python = ">=3.12"
license = { text = "MIT" }

# 说明：本项目不做 pip 安装，此文件主要用于统一 pytest 配置。
# 之所以需要 pythonpath，是因为 tests/ 独立于 code/backend/，
# 需要让 `import app.xxx` 能解析到 code/backend/app 包。

[tool.pytest.ini_options]
pythonpath = ["code/backend", "code"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: 耗时较长的集成测试",
    "integration: 需要完整数据库/端到端的测试",
]

[tool.ruff]
line-length = 100
target-version = "py312"
