[project]
name = "playerstock"
version = "0.1.0"
description = "数据驱动的虚拟选手股交易与智能体市场模拟系统（课程作品）"
requires-python = ">=3.12"
license = { text = "MIT" }

# 说明：本项目不做 pip 安装，此文件主要用于统一 pytest 配置。
# 之所以需要 pythonpath，是因为 tests/ 独立于 code/backend/，
# 需要让 `import app.xxx` 能解析到 code/backend/app 包。

[tool.pytest.ini_options]
pythonpath = ["code/backend", "code"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# 缓存目录（--lf / --sw 的落点）也钉在仓库内：默认的仓库根 .pytest_cache 一旦被外部
# 工具用错误的 ACL 建出来，属主连写都会被打回 WinError 5（第 7 轮实测踩过）
cache_dir = ".pytest-tmp/cache"
markers = [
    "slow: 耗时较长的集成测试",
    "integration: 需要完整数据库/端到端的测试",
]

[tool.ruff]
line-length = 100
target-version = "py312"

# 与 CI（.github/workflows/ci.yml）同口径的规则集：
#   E4/E7/E9 = pycodestyle 的导入/空白/语法级问题（真实缺陷）
#   F        = Pyflakes（未定义名、未使用导入等，真实缺陷）
#   C901     = 圈复杂度（业务/测试阈值 10）
# 编辑器装了 Ruff 插件后会实时按这套规则报问题，不用等 CI 红。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

# scripts/ 是 CLI 入口（argparse 装配天然分支多），CI 单独用 max-complexity=12 卡；
# 编辑器这边直接豁免 C901，避免 Persistent 黄波浪线干扰。
[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["C901"]
