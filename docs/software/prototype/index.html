<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlayerStock 交互原型（AI 生成草稿 · 模拟数据）</title>
<style>
  :root{
    --bg:#0b1220; --panel:#111c33; --panel-2:#0e1729; --line:#22304d;
    --text:#e6edf7; --muted:#94a3b8; --accent:#38bdf8;
    --up:#22c55e; --down:#ef4444; --hold:#cbd5e1; --warn:#f59e0b;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:radial-gradient(1200px 600px at 70% -10%, #16324f 0%, var(--bg) 55%);
    color:var(--text); font:15px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    min-height:100vh;
  }
  a{color:var(--accent)}
  .wrap{max-width:1180px; margin:0 auto; padding:0 20px 48px}
  header.topbar{
    position:sticky; top:0; z-index:10; backdrop-filter:blur(8px);
    background:rgba(11,18,32,.86); border-bottom:1px solid var(--line);
  }
  .topbar-inner{max-width:1180px; margin:0 auto; padding:12px 20px; display:flex; gap:16px; align-items:center; flex-wrap:wrap}
  .brand{font-size:19px; font-weight:700; letter-spacing:.3px; display:flex; align-items:center; gap:10px}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent); box-shadow:0 0 12px var(--accent)}
  .tag{font-size:11px; font-weight:500; color:var(--muted); border:1px solid var(--line); padding:2px 8px; border-radius:999px}
  nav{display:flex; gap:6px; margin-left:8px}
  nav button{
    background:transparent; color:var(--muted); border:1px solid transparent; cursor:pointer;
    padding:7px 14px; border-radius:10px; font-size:14px;
  }
  nav button:hover{color:var(--text); background:var(--panel-2)}
  nav button.active{color:#04121f; background:var(--accent); font-weight:600}
  .account{margin-left:auto; display:flex; gap:22px; align-items:center}
  .account .item{text-align:right}
  .account .label{font-size:11px; color:var(--muted)}
  .account b{font-size:17px; font-variant-numeric:tabular-nums}
  .notice{
    margin:16px auto 0; padding:10px 14px; border:1px dashed #2b4a6f; border-radius:12px;
    background:rgba(56,189,248,.06); color:var(--muted); font-size:13px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  }
  .notice button{margin-left:auto; background:transparent;color:var(--accent);border:1px solid #2b4a6f;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12px}
  main{margin-top:18px}
  .card{background:linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px}
  .card + .card{margin-top:16px}
  .card h2{margin:0 0 4px; font-size:17px}
  .card .sub{color:var(--muted); font-size:13px; margin:0 0 14px}
  .table-wrap{overflow-x:auto}
  table{width:100%; border-collapse:collapse; font-size:14px}
  th,td{padding:11px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
  th{color:var(--muted); font-weight:500; font-size:12px; letter-spacing:.4px}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:rgba(56,189,248,.06)}
  td.num, th.num{text-align:right; font-variant-numeric:tabular-nums}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
  .badge{display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; border:1px solid}
  .badge.buy{color:#86efac; border-color:#166534; background:rgba(34,197,94,.12)}
  .badge.sell{color:#fca5a5; border-color:#7f1d1d; background:rgba(239,68,68,.12)}
  .badge.hold{color:#cbd5e1; border-color:#334155; background:rgba(148,163,184,.12)}
  .badge.sus{color:#fcd34d; border-color:#78350f; background:rgba(245,158,11,.12)}
  .badge.sim{color:#7dd3fc; border-color:#0c4a6e; background:rgba(56,189,248,.10); font-weight:500}
  .btn{
    border:1px solid var(--line); background:var(--panel-2); color:var(--text); cursor:pointer;
    padding:8px 14px; border-radius:10px; font-size:14px;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent)}
  .btn.primary{background:var(--accent); color:#04121f; border-color:var(--accent); font-weight:600}
  .btn.primary:hover{filter:brightness(1.08); color:#04121f}
  .btn.danger{border-color:#7f1d1d; color:#fca5a5}
  .btn.danger:hover{border-color:#ef4444; color:#fecaca}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .btn.sm{padding:5px 10px; font-size:13px}
  .detail-head{display:flex; gap:18px; align-items:flex-end; flex-wrap:wrap}
  .detail-head h1{margin:0; font-size:26px}
  .detail-head .price{font-size:30px; font-weight:700; font-variant-numeric:tabular-nums}
  .detail-head .meta{color:var(--muted); font-size:13px}
  .grid-2{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:16px}
  @media (max-width: 860px){ .grid-2{grid-template-columns:1fr} }
  .chart{width:100%; height:auto; display:block}
  .advice{display:flex; flex-direction:column; gap:10px}
  .advice .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .advice .reason{margin:0; color:var(--text); font-size:14px}
  .advice .disclaimer{color:var(--muted); font-size:12px; margin:0}
  .trade-form{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:6px}
  input[type=number]{
    width:110px; padding:8px 10px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); font-size:14px;
  }
  input[type=number]:focus{outline:none; border-color:var(--accent)}
  .hint{color:var(--muted); font-size:12px}
  .empty{padding:34px 10px; text-align:center; color:var(--muted)}
  footer{margin-top:26px; color:var(--muted); font-size:12px; text-align:center}
  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px);
    background:#0b2540; border:1px solid #2b4a6f; color:var(--text); padding:10px 18px;
    border-radius:12px; font-size:14px; opacity:0; pointer-events:none; transition:all .22s ease; z-index:50;
    box-shadow:0 10px 30px rgba(0,0,0,.4); max-width:90vw;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:#7f1d1d; background:#2a0f14}
  .toast.ok{border-color:#166534; background:#0c2418}
  .back{margin-bottom:12px}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="dot"></span>PlayerStock <span class="tag">交互原型 · AI 生成草稿</span></div>
    <nav id="nav">
      <button data-view="market" class="active">市场</button>
      <button data-view="positions">持仓</button>
      <button data-view="trades">流水</button>
    </nav>
    <div class="account">
      <div class="item"><div class="label">可用余额（虚拟币）</div><b id="balanceText">5000.00</b></div>
      <div class="item"><div class="label">总资产</div><b id="assetText">5000.00</b></div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="notice">
    <span>⚠️ 本页是 <b>AI 生成的交互原型草稿</b>：数据全部为模拟值、虚拟币不可兑换；不连接后端，买卖只在浏览器内存中演示，刷新即重置。</span>
    <button onclick="location.reload()">重置演示数据</button>
  </div>

  <main id="app"></main>

  <footer>
    字段与 <code>docs/software/api_contract.md</code> 对齐；价格/评分为项目模拟数据，非官方统计。
    真实实现见 <code>code/frontend/</code>（A）与 <code>code/backend/</code>（B）。
  </footer>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
 * PlayerStock 交互原型（静态单页，mock 数据）
 * 数据来源：data/seed_players.json（8 名 CS2 选手，身份真实、价格/评分模拟）
 * 与真实实现的关系：本文件只验证交互与信息架构，不调接口；
 * 字段名严格使用 player_id / current_price / prev_price / change_pct / rating。
 * ==========================================================*/

const DISCLAIMER = "仅为分析建议，不构成投资建议；AI 不会自动交易";
const INITIAL_BALANCE = 5000;
const POSITION_LIMIT = 50;

const PLAYERS = [
  { player_id: 1, name: "ZywOo", team: "Vitality", role: "AWPer", prev_price: 120.0, current_price: 126.0, rating: 88, status: "trading",
    latest_reason: "近 3 场表现评分持续上升（模拟数据）",
    history: [120, 121, 123, 124, 126] },
  { player_id: 2, name: "donk", team: "Spirit", role: "Rifler", prev_price: 140.0, current_price: 143.5, rating: 90, status: "trading",
    latest_reason: "模拟评分最高，资金持续流入（模拟数据）",
    history: [140, 140.5, 141, 142.5, 143.5] },
  { player_id: 3, name: "m0NESY", team: "G2", role: "AWPer", prev_price: 96.0, current_price: 91.2, rating: 86, status: "trading",
    latest_reason: "近期战绩波动，价格回落（模拟数据）",
    history: [96, 95, 94, 92, 91.2] },
  { player_id: 4, name: "NiKo", team: "Falcons", role: "Rifler", prev_price: 80.0, current_price: 74.4, rating: 80, status: "trading",
    latest_reason: "连续下跌但表现分仍高，疑为错杀（模拟数据）",
    history: [80, 78, 77, 75, 74.4] },
  { player_id: 5, name: "ropz", team: "FaZe Clan", role: "Lurker", prev_price: 105.0, current_price: 105.0, rating: 78, status: "trading",
    latest_reason: "价格横盘（模拟数据）",
    history: [105, 105, 105, 105, 105] },
  { player_id: 6, name: "jL", team: "NAVI", role: "Rifler", prev_price: 88.0, current_price: 90.2, rating: 74, status: "trading",
    latest_reason: "小幅上涨（模拟数据）",
    history: [88, 89, 89.5, 90, 90.2] },
  { player_id: 7, name: "sh1ro", team: "Spirit", role: "AWPer", prev_price: 130.0, current_price: 136.5, rating: 85, status: "suspended",
    latest_reason: "模拟比赛进行中，暂停交易（模拟数据）",
    history: [130, 131, 133, 135, 136.5] },
  { player_id: 8, name: "flameZ", team: "Vitality", role: "Rifler", prev_price: 70.0, current_price: 63.0, rating: 66, status: "trading",
    latest_reason: "跌幅最大，抄底候选（模拟数据）",
    history: [70, 68, 66, 64, 63] },
];

const state = {
  view: "market",
  currentId: null,
  balance: INITIAL_BALANCE,
  positions: {},   // player_id -> {quantity, avg_cost}
  trades: [],      // 新在前
  seq: 0,
};

/* ---------------- 工具函数 ---------------- */

const byId = (id) => PLAYERS.find((p) => p.player_id === id);
const money = (n) => Number(n).toFixed(2);
const pct = (p) => (p.prev_price > 0 ? (p.current_price - p.prev_price) / p.prev_price * 100 : 0);
const heldQty = (id) => (state.positions[id] ? state.positions[id].quantity : 0);

function changeClass(v) { return v > 0 ? "up" : v < 0 ? "down" : "flat"; }
function signed(v) { return (v > 0 ? "+" : "") + v.toFixed(2) + "%"; }

function positionValue() {
  return Object.entries(state.positions).reduce((sum, [id, pos]) => {
    const player = byId(Number(id));
    return sum + (player ? player.current_price * pos.quantity : 0);
  }, 0);
}

function refreshAccountBar() {
  document.getElementById("balanceText").textContent = money(state.balance);
  document.getElementById("assetText").textContent = money(state.balance + positionValue());
}

let toastTimer = null;
function toast(message, kind) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.className = "toast show" + (kind ? " " + kind : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = "toast"; }, 2600);
}

/* ---------------- AI 建议（与 fallback.py 规则一致，仅用于原型展示） ---------------- */

function windowChangePct(player) {
  const prices = player.history.slice(-6);
  if (prices.length >= 2) {
    return (prices[prices.length - 1] - prices[0]) / prices[0] * 100;
  }
  return pct(player);
}

function adviceFor(player) {
  const change = windowChangePct(player);
  const held = heldQty(player.player_id);
  let action = "HOLD";
  let risk = "LOW";
  let reason;

  if (change > 5 && player.rating < 60) {
    action = "SELL"; risk = "HIGH";
    reason = `近 5 个价格点累计上涨 ${change.toFixed(1)}%，但综合表现分仅 ${player.rating}，上涨缺乏表现支撑（规则版建议）`;
  } else if (change < -5 && player.rating >= 75) {
    action = "BUY"; risk = "MEDIUM";
    reason = `近 5 个价格点累计下跌 ${change.toFixed(1)}%，但综合表现分仍有 ${player.rating}，回调后估值偏低（规则版建议）`;
  } else {
    reason = `近 5 个价格点累计变动 ${change.toFixed(1)}%，综合表现分 ${player.rating}，未触发买卖阈值（规则版建议）`;
  }

  if (action === "SELL" && held <= 0) {
    action = "HOLD"; risk = "LOW";
    reason = `价格虽累计上涨 ${change.toFixed(1)}% 且表现分仅 ${player.rating}，但当前无持仓，卖出无实际意义，建议观望（规则版建议）`;
  }
  return { action, risk, reason, source: "rule_fallback", disclaimer: DISCLAIMER };
}

const ADVICE_LABEL = { BUY: "买入", SELL: "卖出", HOLD: "观望" };
const RISK_LABEL = { LOW: "低风险", MEDIUM: "中风险", HIGH: "高风险" };

/* ---------------- 图表（内联 SVG，无第三方依赖） ---------------- */

function renderChart(player) {
  const prices = player.history;
  const width = 600, height = 190, padX = 46, padY = 26;
  const max = Math.max(...prices), min = Math.min(...prices);
  const span = max - min || 1;
  const x = (i) => padX + (i * (width - padX * 2)) / (prices.length - 1);
  const y = (v) => height - padY - ((v - min) / span) * (height - padY * 2);

  const points = prices.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const area = `${padX},${height - padY} ${points} ${width - padX},${height - padY}`;
  const dots = prices.map((v, i) =>
    `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.5" fill="#38bdf8" />`
  ).join("");
  const labels = prices.map((v, i) =>
    `<text x="${x(i).toFixed(1)}" y="${height - 6}" fill="#64748b" font-size="11" text-anchor="middle">${i + 1}</text>`
  ).join("");

  return `
    <svg class="chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="价格走势（示意）">
      <defs>
        <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#38bdf8" stop-opacity=".28" />
          <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
        </linearGradient>
      </defs>
      <line x1="${padX}" y1="${height - padY}" x2="${width - padX}" y2="${height - padY}" stroke="#22304d" />
      <polygon points="${area}" fill="url(#areaFill)" />
      <polyline points="${points}" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
      ${dots}
      ${labels}
      <text x="${padX}" y="${padY - 8}" fill="#64748b" font-size="11">模拟价格 · 最近 ${prices.length} 个点</text>
      <text x="${width - padX}" y="${padY - 8}" fill="#64748b" font-size="11" text-anchor="end">最高 ${money(max)} / 最低 ${money(min)}</text>
    </svg>`;
}

/* ---------------- 视图：市场 ---------------- */

function renderMarket() {
  const rows = PLAYERS.map((player) => {
    const change = pct(player);
    const status = player.status === "trading"
      ? `<span class="badge sim">可交易</span>`
      : `<span class="badge sus">暂停交易</span>`;
    return `
      <tr onclick="showDetail(${player.player_id})">
        <td><b>${player.name}</b><div class="hint">${player.team} · ${player.role}</div></td>
        <td class="num">${money(player.current_price)}</td>
        <td class="num ${changeClass(change)}">${signed(change)}</td>
        <td class="num">${player.rating} <span class="hint">模拟</span></td>
        <td>${status}</td>
        <td class="num"><button class="btn sm" onclick="event.stopPropagation(); showDetail(${player.player_id})">查看 / 交易</button></td>
      </tr>`;
  }).join("");

  return `
    <section class="card">
      <h2>市场行情</h2>
      <p class="sub">8 名 CS2 选手 · 价格为项目模拟值 · 点任意一行查看详情与 AI 建议</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>选手</th><th class="num">当前价</th><th class="num">涨跌幅</th><th class="num">表现评分</th><th>状态</th><th class="num">操作</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </section>`;
}

/* ---------------- 视图：选手详情 + 交易 ---------------- */

function renderDetail(playerId) {
  const player = byId(playerId);
  if (!player) { renderMarket(); return; }
  const change = pct(player);
  const advice = adviceFor(player);
  const held = heldQty(playerId);
  const averageCost = state.positions[playerId] ? state.positions[playerId].avg_cost : 0;
  const trading = player.status === "trading";

  return `
    <button class="btn sm back" onclick="go('market')">← 返回市场</button>

    <section class="card">
      <div class="detail-head">
        <div>
          <h1>${player.name}</h1>
          <div class="meta">${player.team} · ${player.role} · 表现评分 ${player.rating} <span class="badge sim">模拟</span></div>
        </div>
        <div style="margin-left:auto; text-align:right">
          <div class="price">${money(player.current_price)}</div>
          <div class="${changeClass(change)}">${signed(change)} <span class="hint">较上一价 ${money(player.prev_price)}</span></div>
        </div>
        <div class="meta">最近变化原因：${player.latest_reason}</div>
      </div>
      ${renderChart(player)}
    </section>

    <div class="grid-2">
      <section class="card">
        <h2>交易（原型模拟）</h2>
        <p class="sub">可用余额 ${money(state.balance)} · 当前持有 ${held} 股${held ? `，均价 ${money(averageCost)}` : ""} · 单选手上限 ${POSITION_LIMIT} 股</p>
        ${trading ? "" : `<p class="hint" style="color:#fcd34d">该选手正在模拟比赛中，暂停交易（对应接口错误码 PLAYER_TRADING_SUSPENDED）。</p>`}
        <div class="trade-form">
          <label class="hint" for="qty">数量</label>
          <input id="qty" type="number" min="1" step="1" value="1" ${trading ? "" : "disabled"} />
          <button class="btn primary" ${trading ? "" : "disabled"} onclick="trade(${playerId}, 'BUY')">买入</button>
          <button class="btn danger" ${trading ? "" : "disabled"} onclick="trade(${playerId}, 'SELL')">卖出</button>
        </div>
        <p class="hint" style="margin-top:10px">原型校验：正整数 / 余额足够 / 持仓足够 / 单选手 ≤ ${POSITION_LIMIT} 股 / 暂停交易不可下单；真实实现以 <code>POST /api/trades/buy|sell</code> 为准。</p>
      </section>

      <section class="card">
        <h2>AI 分析建议</h2>
        <p class="sub">与 <code>GET /api/analysis/{player_id}</code> 的 6 字段契约一致；无密钥/超时/脏输出时就是这条规则版建议</p>
        <div class="advice">
          <div class="row">
            <span class="badge ${advice.action.toLowerCase()}">${advice.action} · ${ADVICE_LABEL[advice.action]}</span>
            <span class="badge ${advice.action.toLowerCase()}">${advice.risk} · ${RISK_LABEL[advice.risk]}</span>
            <span class="hint">source = ${advice.source}</span>
          </div>
          <p class="reason">${advice.reason}</p>
          <p class="disclaimer">${advice.disclaimer}</p>
        </div>
      </section>
    </div>`;
}

/* ---------------- 视图：持仓 / 流水 ---------------- */

function renderPositions() {
  const ids = Object.keys(state.positions);
  if (!ids.length) {
    return `
      <section class="card">
        <h2>我的持仓</h2>
        <div class="empty">暂无持仓 —— 去<a href="javascript:go('market')">市场</a>挑一位选手买入吧。</div>
      </section>`;
  }

  const rows = ids.map((rawId) => {
    const id = Number(rawId);
    const player = byId(id);
    const pos = state.positions[id];
    const marketValue = player.current_price * pos.quantity;
    const cost = pos.avg_cost * pos.quantity;
    const profit = marketValue - cost;
    const profitPct = cost > 0 ? (profit / cost) * 100 : 0;
    return `
      <tr onclick="showDetail(${id})">
        <td><b>${player.name}</b><div class="hint">${player.team}</div></td>
        <td class="num">${pos.quantity}</td>
        <td class="num">${money(pos.avg_cost)}</td>
        <td class="num">${money(player.current_price)}</td>
        <td class="num">${money(marketValue)}</td>
        <td class="num ${changeClass(profit)}">${money(profit)}（${signed(profitPct)}）</td>
      </tr>`;
  }).join("");

  const totalCost = ids.reduce((sum, rawId) => sum + state.positions[Number(rawId)].avg_cost * state.positions[Number(rawId)].quantity, 0);
  const totalMarket = ids.reduce((sum, rawId) => sum + byId(Number(rawId)).current_price * state.positions[Number(rawId)].quantity, 0);
  const totalProfit = totalMarket - totalCost;

  return `
    <section class="card">
      <h2>我的持仓</h2>
      <p class="sub">市值 <b>${money(totalMarket)}</b> · 成本 <b>${money(totalCost)}</b> · 浮动盈亏
        <b class="${changeClass(totalProfit)}">${money(totalProfit)}（${totalCost > 0 ? signed(totalProfit / totalCost * 100) : "0.00%"}）</b></p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>选手</th><th class="num">数量</th><th class="num">均价</th><th class="num">当前价</th><th class="num">市值</th><th class="num">浮动盈亏</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </section>`;
}

function renderTrades() {
  if (!state.trades.length) {
    return `
      <section class="card">
        <h2>交易流水</h2>
        <div class="empty">还没有交易记录，先买入一笔试试。</div>
      </section>`;
  }

  const rows = state.trades.map((trade) => `
    <tr>
      <td><span class="badge ${trade.side === "BUY" ? "buy" : "sell"}">${trade.side}</span></td>
      <td>${trade.name}</td>
      <td class="num">${trade.quantity}</td>
      <td class="num">${money(trade.price)}</td>
      <td class="num">${money(trade.amount)}</td>
      <td class="num">${money(trade.balance_after)}</td>
      <td>${trade.created_at}</td>
    </tr>`).join("");

  return `
    <section class="card">
      <h2>交易流水</h2>
      <p class="sub">按时间倒序 · 与 <code>GET /api/trades</code> 的字段一致（实际接口还会带 trade_id / player_id）</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>方向</th><th>选手</th><th class="num">数量</th><th class="num">成交价</th><th class="num">金额</th><th class="num">成交后余额</th><th>时间</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </section>`;
}

/* ---------------- 交易逻辑（纯前端演示） ---------------- */

function trade(playerId, side) {
  const player = byId(playerId);
  if (!player) return;
  if (player.status !== "trading") {
    toast("该选手暂停交易，无法下单", "err");
    return;
  }

  const input = document.getElementById("qty");
  const quantity = Number(input ? input.value : 0);
  if (!Number.isInteger(quantity) || quantity <= 0) {
    toast("数量必须是正整数", "err");
    return;
  }

  const price = player.current_price;
  const amount = Math.round(price * quantity * 100) / 100;
  const held = heldQty(playerId);

  if (side === "BUY") {
    if (held + quantity > POSITION_LIMIT) {
      toast(`超出单选手持仓上限（最多 ${POSITION_LIMIT} 股）`, "err");
      return;
    }
    if (amount > state.balance) {
      toast(`余额不足：需要 ${money(amount)}，可用 ${money(state.balance)}`, "err");
      return;
    }
    const cost = held * (state.positions[playerId] ? state.positions[playerId].avg_cost : 0) + amount;
    const newQty = held + quantity;
    state.positions[playerId] = { quantity: newQty, avg_cost: Math.round((cost / newQty) * 10000) / 10000 };
    state.balance = Math.round((state.balance - amount) * 100) / 100;
  } else {
    if (held < quantity) {
      toast(`持仓不足：当前持有 ${held} 股`, "err");
      return;
    }
    state.balance = Math.round((state.balance + amount) * 100) / 100;
    if (held === quantity) delete state.positions[playerId];
    else state.positions[playerId].quantity = held - quantity;
  }

  state.seq += 1;
  state.trades.unshift({
    trade_id: state.seq,
    player_id: playerId,
    name: player.name,
    side,
    quantity,
    price,
    amount,
    balance_after: state.balance,
    created_at: new Date().toLocaleString("zh-CN", { hour12: false }),
  });

  refreshAccountBar();
  toast(`${side === "BUY" ? "买入" : "卖出"}成功：${quantity} 股 × ${money(price)}，余额 ${money(state.balance)}`, "ok");
  render();
}

/* ---------------- 路由与渲染 ---------------- */

/* 简单 hash 路由：支持 #/market、#/positions、#/trades、#/player/1 直接打开某个界面 */
function hashForState() {
  return state.view === "detail" ? `#/player/${state.currentId}` : `#/${state.view}`;
}

function applyHash() {
  const hash = location.hash.replace(/^#\/?/, "");
  const playerMatch = hash.match(/^player\/(\d+)$/);
  if (playerMatch && byId(Number(playerMatch[1]))) {
    state.view = "detail";
    state.currentId = Number(playerMatch[1]);
  } else if (["market", "positions", "trades"].includes(hash)) {
    state.view = hash;
    state.currentId = null;
  }
}

function go(view) {
  state.view = view;
  state.currentId = null;
  if (location.hash !== hashForState()) location.hash = hashForState();
  render();
}

function showDetail(playerId) {
  state.view = "detail";
  state.currentId = playerId;
  if (location.hash !== hashForState()) location.hash = hashForState();
  render();
}

function render() {
  const app = document.getElementById("app");
  if (state.view === "detail") app.innerHTML = renderDetail(state.currentId);
  else if (state.view === "positions") app.innerHTML = renderPositions();
  else if (state.view === "trades") app.innerHTML = renderTrades();
  else app.innerHTML = renderMarket();

  document.querySelectorAll("#nav button").forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.view === state.view);
  });
  refreshAccountBar();
}

document.querySelectorAll("#nav button").forEach((btn) => {
  btn.addEventListener("click", () => go(btn.dataset.view));
});

window.addEventListener("hashchange", () => {
  applyHash();
  render();
});

applyHash();
render();

</script>
